[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filamind-iot-proxy"
version = "0.1.0"
description = "Self-hosted IoT-Box pairing rendezvous + ACME cert issuer + reverse-tunnel relay (LGPL-3 alternative to iot-proxy.odoo.com)"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
authors = [{name = "filamind"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.32,<0.40",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "redis[hiredis]>=5.0,<6.0",
    "httpx>=0.27,<0.30",
    "python-multipart>=0.0.9,<0.1",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.30",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<0.30",
    "asgi-lifespan>=2.1,<3.0",
    "aiosqlite>=0.20,<0.22",
    "fakeredis>=2.25,<3.0",
    "ruff>=0.7,<0.20",
]

[tool.setuptools]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
